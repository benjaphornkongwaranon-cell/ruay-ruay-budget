.55fr .85fr;gap:18px}.section-title{font-size:18px;margin:0 0 16px}.table-head,.row{display:grid;grid-template-columns:1.4fr .72fr .72fr .72fr;gap:8px;align-items:center}.table-head{padding:0 8px 10px;color:var(--muted);font-size:12px}.row{padding:14px 8px;border-top:1px solid var(--line);font-size:14px}.row strong{font-size:15px}.diff{color:#39805d;font-weight:700}.empty{color:#a2aeab}.total{margin-top:8px;background:#eff5ef;border:0;border-radius:12px;font-weight:800}.cat{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:var(--mint)}.dot.peach{background:#e99c64}.dot.coral{background:var(--coral)}.dot.ink{background:#40617e}.side{display:flex;flex-direction:column;gap:18px}.donut-wrap{display:flex;align-items:center;gap:20px}.donut{width:122px;aspect-ratio:1;border-radius:50%;background:conic-gradient(#5e9b79 0 45%,#e99c64 45% 81%,#db775f 81% 100%);display:grid;place-items:center}.donut:after{content:"";width:78px;height:78px;border-radius:50%;background:#fff}.legend{font-size:13px;line-height:2}.legend b{float:right;margin-left:20px}.tip{background:#fff6ed;border-color:#f0dac5}.tip h3{margin:0 0 6px;font-size:16px}.tip p{line-height:1.6}.transactions{margin-top:18px}.tx{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.tx small{display:block;color:var(--muted);margin-top:3px}.tx-right{display:flex;align-items:center;gap:12px}.edit{background:#eef5ef;color:#276044;border:0;border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}dialog{border:0;border-radius:20px;padding:0;box-shadow:0 20px 60px #0004;width:min(430px,calc(100% - 32px)}dialog::backdrop{background:#17252488}.modal{padding:25px}.modal h2{margin-top:0}.modal label{font-size:13px;font-weight:700;display:block;margin-top:12px}.modal input,.modal select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font:inherit}.modal-actions{display:flex;gap:8px;justify-content:end;margin-top:20px}.cancel{background:#edf1ee;color:var(--ink)}@media(max-width:760px){.app{padding:20px 15px}.welcome{align-items:start;flex-direction:column}.summary,.content{grid-template-columns:1fr}.top{margin-bottom:22px}.welcome h1{font-size:29px}.table-head,.row{grid-template-columns:1.35fr .8fr .8fr}.table-head div:last-child,.row div:last-child{display:none}.month{display:none}}

    .budget-cards{grid-template-columns:1fr;gap:14px}.budget-card{min-height:142px;background:#fff!important;border:1px solid var(--line)!important;border-left:6px solid var(--mint)!important;padding:18px 19px;box-shadow:0 6px 16px #173c3a0c}.budget-card:nth-child(2){border-left-color:#e99c64!important}.budget-card:nth-child(3){border-left-color:var(--coral)!important}.budget-card:nth-child(4){border-left-color:#40617e!important}.budget-card:nth-child(5){border-left-color:var(--mint)!important}.budget-card .cat strong{font-size:16px}.remain{background:#eff8f0;border-radius:11px;padding:8px 12px;min-width:128px}.budget-meta{padding-top:13px;font-size:13px;justify-content:space-between}.budget-total{margin-top:4px}.tip{display:none}

<body>
<main class="app"><header class="top"><div class="brand"><span class="mark">฿</span>รวย รวย</div><div class="top-actions"><button id="installButton" class="install">⇩ ติดตั้งแอป</button><div class="month">พฤศจิกายน 2569 ▾</div></div></header>
<section class="welcome"><div><div class="eyebrow">ภาพรวมเดือนนี้</div><h1>เงินของคุณกำลังไปได้ดี</h1></div><button class="add" onclick="document.querySelector('dialog').showModal()">＋ บันทึกรายการ</button></section>
<section class="summary"><article class="card hero"><p>ใช้ไปแล้วจากงบทั้งหมด</p><h2 id="spent">฿3,022 <small>/ ฿20,400</small></h2><div class="bar"><i id="progress"></i></div></article><article class="card"><p>คงเหลือใช้ได้</p><h2 class="green" id="remaining">฿17,378</h2><p>เหลือ 85% ของงบ</p></article><article class="card"><p>ใช้จ่ายเฉลี่ยต่อวัน</p><h2>฿101</h2><p>จากเป้าหมาย ฿300 / วัน</p></article></section>
<section class="content"><article class="card"><h2 class="section-title">งบประมาณตามหมวด</h2><div id="budgetRows" class="budget-cards"></div></article></section>
<article class="card transactions"><div class="transaction-head"><div><h2 class="section-title">รายการรายวัน</h2><p id="dailyTotal">ยอดใช้จ่ายวันนี้</p></div><label class="day-picker">เลือกวันที่<input id="dayFilter" type="date" onchange="render()" /></label></div><div id="transactionRows"></div></article></main>
<dialog><form class="modal" method="dialog" onsubmit="saveTransaction(event)"><h2 id="modalTitle">บันทึกรายการใหม่</h2><label>รายละเอียด<input required id="title" placeholder="เช่น ซื้อกาแฟ" /></label><label>หมวดหมู่<select id="category"></select></label><label>วันที่<input required id="transactionDate" type="date" /></label><label>จำนวนเงิน (บาท)<input required id="amount" type="number" min="1" placeholder="0" /></label><div class="modal-actions"><button class="add cancel" type="button" onclick="cancelTransaction()">ยกเลิก</button><button class="add" id="saveButton" value="default">บันทึก</button></div></form></dialog>
<script>
const base=[['เงินที่ใช้ต่อวัน 300 × 30',9000,1087,'mint'],['เงินที่ใช้ไว้สำรองตอนออกหน้างาน',4000,880,'peach'],['Shopping',4000,1055,'coral'],['ค่าอาหารแมว',2000,0,'ink'],['ค่าโทร',1400,0,'mint']];let tx=JSON.parse(localStorage.getItem('bloomTx')||'[]'),editingIndex=null;const f=n=>'฿'+n.toLocaleString('th-TH');
function totals(){let rows=base.map(x=>[...x]);tx.forEach(t=>{let r=rows.find(x=>x[0]===t.category);if(r)r[2]+=t.amount});return rows}function render(){let rows=totals(), spent=rows.reduce((s,r)=>s+r[2],0), target=rows.reduce((s,r)=>s+r[1],0);document.getElementById('spent').innerHTML=f(spent)+' <small>/ '+f(target)+'</small>';document.getElementById('remaining').textContent=f(target-spent);document.getElementById('progress').style.width=(spent/target*100)+'%';document.getElementById('budgetRows').innerHTML=rows.map(r=>`<div class="budget-card"><div class="cat"><i class="dot ${r[3]}"></i><strong>${r[0]}</strong></div><div class="remain"><span>คงเหลือ</span><b>${f(r[1]-r[2])}</b></div><div class="budget-meta"><span>เป้าหมาย <b>${f(r[1])}</b></span><span>ใช้จริง <b class="${r[2]?'':'empty'}">${r[2]?f(r[2]):'—'}</b></span></div></div>`).join('');document.getElementById('transactionRows').innerHTML=tx.length?tx.map((t,i)=>({t,i})).reverse().slice(0,5).map(({t,i})=>`<div class="tx"><div><strong>${t.title}</strong><small>${t.category} · วันนี้</small></div><div class="tx-right"><b>−${f(t.amount)}</b><button class="edit" onclick="editTransaction(${i})">แก้ไข</button></div></div>`).join(''):'<div class="tx"><div><strong>ยังไม่มีรายการเพิ่ม</strong><small>กด “บันทึกรายการ” เพื่อเริ่มต้น</small></div></div>';document.getElementById('category').innerHTML=base.map(r=>`<option>${r[0]}</option>`).join('')}
function editTransaction(i){editingIndex=i;let t=tx[i];document.getElementById('modalTitle').textContent='แก้ไขรายการ';document.getElementById('saveButton').textContent='บันทึกการแก้ไข';document.getElementById('title').value=t.title;document.getElementById('category').value=t.category;document.getElementById('amount').value=t.amount;document.querySelector('dialog').showModal()}function saveTransaction(e){e.preventDefault();let item={title:document.getElementById('title').value,category:document.getElementById('category').value,amount:+document.getElementById('amount').value};editingIndex===null?tx.push(item):tx[editingIndex]=item;localStorage.setItem('bloomTx',JSON.stringify(tx));editingIndex=null;e.target.closest('dialog').close();e.target.reset();document.getElementById('modalTitle').textContent='บันทึกรายการใหม่';document.getElementById('saveButton').textContent='บันทึก';render()}let installEvent;const installButton=document.getElementById('installButton');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;installButton.style.display='block'});installButton.addEventListener('click',async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;installEvent=null;installButton.style.display='none'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');render();
</script><style>.transaction-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.transaction-head .section-title{margin-bottom:3px}.day-picker{font-size:12px;color:var(--muted);font-weight:700}.day-picker input{display:block;margin-top:4px;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;font:inherit;color:var(--ink)}#dailyTotal{font-size:13px!important;color:var(--mint)!important;font-weight:700}</style><script>
function cancelTransaction(){editingIndex=null;const form=document.querySelector('dialog form');form.reset();document.getElementById('modalTitle').textContent='บันทึกรายการใหม่';document.getElementById('saveButton').textContent='บันทึก';document.getElementById('transactionDate').value=new Date().toLocaleDateString('en-CA');document.querySelector('dialog').close()}
const today=new Date().toLocaleDateString('en-CA');tx=tx.map(item=>({...item,date:item.date||today}));localStorage.setItem('bloomTx',JSON.stringify(tx));const overviewRender=render;render=function(){overviewRender();const selected=document.getElementById('dayFilter').value||today;const daily=tx.map((item,index)=>({item,index})).filter(({item})=>item.date===selected).reverse();const total=daily.reduce((sum,{item})=>sum+item.amount,0);document.getElementById('dailyTotal').textContent=`ยอดใช้จ่าย ${f(total)} · ${daily.length} รายการ`;document.getElementById('transactionRows').innerHTML=daily.length?daily.map(({item,index})=>`<div class="tx"><div><strong>${item.title}</strong><small>${item.category} · ${new Date(item.date+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}</small></div><div class="tx-right"><b>−${f(item.amount)}</b><button class="edit" onclick="editTransaction(${index})">แก้ไข</button></div></div>`).join(''):`<div class="tx"><div><strong>ไม่มีรายการในวันนี้</strong><small>เลือกวันอื่น หรือเพิ่มรายการใหม่</small></div></div>`};saveTransaction=function(e){e.preventDefault();const item={title:document.getElementById('title').value,category:document.getElementById('category').value,date:document.getElementById('transactionDate').value,amount:+document.getElementById('amount').value};editingIndex===null?tx.push(item):tx[editingIndex]=item;localStorage.setItem('bloomTx',JSON.stringify(tx));editingIndex=null;e.target.closest('dialog').close();e.target.reset();document.getElementById('transactionDate').value=today;document.getElementById('modalTitle').textContent='บันทึกรายการใหม่';document.getElementById('saveButton').textContent='บันทึก';document.getElementById('dayFilter').value=item.date;render()};editTransaction=function(index){editingIndex=index;const item=tx[index];document.getElementById('modalTitle').textContent='แก้ไขรายการ';document.getElementById('saveButton').textContent='บันทึกการแก้ไข';document.getElementById('title').value=item.title;document.getElementById('category').value=item.category;document.getElementById('transactionDate').value=item.date;document.getElementById('amount').value=item.amount;document.querySelector('dialog').showModal()};document.getElementById('dayFilter').value=today;document.getElementById('transactionDate').value=today;render();
const dailyRender=render;render=function(){dailyRender();document.querySelectorAll('.budget-meta span:first-child').forEach(item=>{item.childNodes[0].textContent='งบ '})};render();
</script><style>.budget-meta{font-size:11px!important}.budget-meta b{font-size:11px;font-weight:600}.remain b{color:#c94a48!important}/* แยกการ์ดงบแต่ละหมวดออกจากกรอบรวม */.content>article:first-child{background:transparent;border:0;padding:0}.content>article:first-child .section-title{padding:0 2px}.budget-card{border-left-width:1px!important;min-height:0;padding:18px;box-shadow:0 4px 14px #173c3a10}.budget-total{box-shadow:0 4px 14px #173c3a10}@media(min-width:761px){.budget-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.budget-total{grid-column:1/-1}}/* ฟอร์มบันทึกรายการ: ข้อมูลเรียงแนวตั้งทีละช่อง */.modal{display:flex;flex-direction:column;gap:12px;padding:24px}.modal h2{margin:0 0 2px}.modal label{margin:0;padding:11px 12px 12px;border:1px solid var(--line);border-radius:13px;background:#f9fbf9;color:var(--ink)}.modal input,.modal select{margin-top:7px;background:#fff;padding:12px}.modal-actions{margin-top:6px;display:grid;grid-template-columns:1fr 1.4fr}.modal-actions .add{width:100%;padding:13px}.share-toggle{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);padding:14px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 3px 10px #173c3a0a}.share-toggle span:first-child{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#eaf4ec;color:#27724e;font-size:20px}.share-toggle i{margin-left:auto;font-style:normal;color:var(--muted);transition:transform .2s}.share-toggle[aria-expanded="true"] i{transform:rotate(180deg)}.expense-share{margin-top:-4px}@media(max-width:480px){dialog{width:calc(100% - 28px);max-height:calc(100dvh - 28px);margin:auto;overflow-y:auto;overscroll-behavior:contain}.modal{padding:18px;gap:9px}.modal label{padding:9px 11px 10px}.modal input,.modal select{font-size:16px;min-height:44px}.modal-actions{position:sticky;bottom:-18px;background:#fff;padding:10px 0 calc(2px + env(safe-area-inset-bottom));margin:0}}</style><script>function toggleExpenseShare(){const panel=document.getElementById('expenseShare'),button=document.querySelector('.share-toggle'),open=panel.hasAttribute('hidden');panel.toggleAttribute('hidden',!open);button.setAttribute('aria-expanded',String(open))}</script></body></html>
