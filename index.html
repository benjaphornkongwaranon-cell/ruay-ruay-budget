<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c3a"><meta name="apple-mobile-web-app-capable" content="yes"><title>รวย รวย — รายรับรายจ่าย</title>
<style>
:root{--ink:#162c2b;--muted:#71817e;--line:#e4e9e6;--mint:#5e9b79;--navy:#173c3a;--red:#c94a48}*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:var(--ink);font-family:Tahoma,"Noto Sans Thai",sans-serif}.app{max-width:760px;margin:auto;padding:24px 16px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--navy);color:white}.month{font-size:13px;color:var(--muted);padding:9px 11px;background:white;border:1px solid var(--line);border-radius:11px}.welcome{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:17px}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mint);font-weight:800}.welcome h1{margin:5px 0 0;font-size:28px}.add{border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:800;padding:12px 15px;cursor:pointer}.summary{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:17px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.hero{grid-column:1/-1;background:var(--navy);color:white;border:0}.card p{margin:0;color:var(--muted);font-size:13px}.hero p{color:#c7dbd8}.card h2{margin:7px 0 4px;font-size:25px}.bar{height:7px;border-radius:9px;background:#ffffff2b;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:#9cd4a5}.section-title{margin:0 0 13px;font-size:18px}.budget-cards{display:grid;gap:12px}.budget-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:16px;border:1px solid var(--line);border-left:5px solid var(--mint);border-radius:16px;background:#fff;box-shadow:0 3px 10px #173c3a0a}.budget-card:nth-child(2){border-left-color:#e99c64}.budget-card:nth-child(3){border-left-color:#db775f}.budget-card:nth-child(4){border-left-color:#40617e}.cat{display:flex;align-items:center;gap:9px;font-size:15px}.dot{width:9px;height:9px;border-radius:50%;background:var(--mint)}.remain{text-align:right;background:#eff8f0;border-radius:11px;padding:8px 11px;white-space:nowrap}.remain span{display:block;font-size:11px;color:var(--muted)}.remain b{font-size:20px;color:var(--red)}.budget-meta{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid #173c3a10;padding-top:11px;font-size:12px;color:var(--muted)}.budget-meta b{color:var(--ink);margin-left:4px}.transactions{margin-top:16px}.transaction-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.day-picker{font-size:12px;color:var(--muted);font-weight:700}.day-picker input{display:block;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}.tx{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.tx small{display:block;color:var(--muted);margin-top:3px}.tx-right{display:flex;align-items:center;gap:7px}.edit,.delete{border:0;border-radius:8px;padding:7px 9px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.edit{background:#eef5ef;color:#276044}.delete{background:#fff0ef;color:#b83f3d}dialog{border:0;border-radius:20px;padding:0;width:min(430px,calc(100% - 28px));box-shadow:0 20px 60px #0004}.modal{display:flex;flex-direction:column;gap:10px;padding:20px}.modal h2{margin:0 0 4px}.modal label{padding:10px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:700}.modal input,.modal select{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px;background:white}.modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:4px}.cancel{background:#edf1ee;color:var(--ink)}@media(max-width:480px){.app{padding:calc(14px + env(safe-area-inset-top)) 14px 28px}.welcome{align-items:start;flex-direction:column}.welcome .add{width:100%}.month{display:none}.budget-card{padding:14px}.transactions{padding:15px}.tx-right{gap:6px}.edit,.delete{padding:7px 8px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><span class="mark">฿</span>รวย รวย</div><div class="month">พฤศจิกายน 2569 ▾</div></header>
<section class="welcome"><div><div class="eyebrow">ภาพรวมเดือนนี้</div><h1>เงินของคุณกำลังไปได้ดี</h1></div><button class="add" onclick="openNew()">＋ บันทึกรายการ</button></section>
<section class="summary"><article class="card hero"><p>ใช้ไปแล้วจากงบทั้งหมด</p><h2 id="spent"></h2><div class="bar"><i id="progress"></i></div></article><article class="card"><p>คงเหลือใช้ได้</p><h2 id="remaining"></h2><p id="percent"></p></article></section>
<section><h2 class="section-title">งบประมาณตามหมวด</h2><div id="budgetRows" class="budget-cards"></div></section>
<article class="card transactions"><div class="transaction-head"><div><h2 class="section-title">รายการรายวัน</h2><p id="dailyTotal"></p></div><label class="day-picker">เลือกวันที่<input id="dayFilter" type="date"></label></div><div id="transactionRows"></div></article>
</main>
<dialog id="formDialog"><form class="modal" id="transactionForm"><h2 id="modalTitle">บันทึกรายการใหม่</h2><label>รายละเอียด<input required id="title" placeholder="เช่น ซื้อกาแฟ"></label><label>หมวดหมู่<select id="category"></select></label><label>วันที่<input required id="transactionDate" type="date"></label><label>จำนวนเงิน (บาท)<input required id="amount" type="number" min="1" placeholder="0"></label><div class="modal-actions"><button class="add cancel" type="button" onclick="cancelTransaction()">ยกเลิก</button><button class="add" type="submit" id="saveButton">บันทึก</button></div></form></dialog>
<script>
const base=[["เงินที่ต้องใช้ต่อวัน",9000,7077,"mint"],["เงินที่ใช้ไว้สำรองตอนออกหน้างาน",4000,880,"peach"],["Shopping",4000,5181,"coral"],["ค่าทำผม",0,1100,"ink"],["ค่าอาหารแมว",2000,0,"mint"],["ค่าโทร",1400,0,"mint"]];
let tx=JSON.parse(localStorage.getItem("bloomTx")||"[]"),editingIndex=null;const today=new Date().toLocaleDateString("en-CA"),f=n=>"฿"+Number(n).toLocaleString("th-TH");tx=tx.map(x=>Object.assign({},x,{date:x.date||today}));
const dialog=document.getElementById("formDialog"),form=document.getElementById("transactionForm");document.getElementById("category").innerHTML=base.map(r=>"<option>"+r[0]+"</option>").join("");document.getElementById("dayFilter").value=today;document.getElementById("transactionDate").value=today;
function totals(){const rows=base.map(x=>x.slice());tx.forEach(t=>{const row=rows.find(r=>r[0]===t.category);if(row)row[2]+=Number(t.amount)});return rows}
function render(){const rows=totals(),spent=rows.reduce((s,r)=>s+r[2],0),budget=rows.reduce((s,r)=>s+r[1],0);document.getElementById("spent").innerHTML="<span style='color:"+(spent>=0?"#27724e":"#c94a48")+"'>"+f(spent)+"</span> <small>/ "+f(budget)+"</small>";document.getElementById("remaining").innerHTML="<span style='color:"+(budget-spent>=0?"#27724e":"#c94a48")+"'>"+f(budget-spent)+"</span>";document.getElementById("percent").textContent="เหลือ "+Math.max(0,Math.round((budget-spent)/budget*100))+"% ของงบ";document.getElementById("progress").style.width=Math.min(100,spent/budget*100)+"%";document.getElementById("budgetRows").innerHTML=rows.map(r=>"<div class=\"budget-card\"><div class=\"cat\"><i class=\"dot\"></i><strong>"+r[0]+"</strong></div><div class=\"remain\"><span>คงเหลือ</span><b style='color:"+(r[1]-r[2]>=0?"#27724e":"#c94a48")+"'>"+f(r[1]-r[2])+"</b></div><div class=\"budget-meta\"><span>งบ <b>"+f(r[1])+"</b></span><span>ใช้จริง <b>"+(r[2]?f(r[2]):"—")+"</b></span></div></div>").join("");const selected=document.getElementById("dayFilter").value||today,daily=tx.map((item,index)=>({item,index})).filter(x=>x.item.date===selected).reverse();document.getElementById("dailyTotal").textContent="ยอดใช้จ่าย "+f(daily.reduce((s,x)=>s+Number(x.item.amount),0))+" · "+daily.length+" รายการ";document.getElementById("transactionRows").innerHTML=daily.length?daily.map(x=>"<div class=\"tx\"><div><strong>"+x.item.title+"</strong><small>"+x.item.category+" · "+new Date(x.item.date+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})+"</small></div><div class=\"tx-right\"><b>−"+f(x.item.amount)+"</b><button class=\"edit\" onclick=\"editTransaction("+x.index+")\">แก้ไข</button><button class=\"delete\" onclick=\"deleteTransaction("+x.index+")\">ลบ</button></div></div>").join(""):"<div class=\"tx\"><strong>ไม่มีรายการในวันนี้</strong><small>เลือกวันอื่น หรือเพิ่มรายการใหม่</small></div>";localStorage.setItem("bloomTx",JSON.stringify(tx))}
function openNew(){editingIndex=null;form.reset();document.getElementById("transactionDate").value=document.getElementById("dayFilter").value||today;document.getElementById("modalTitle").textContent="บันทึกรายการใหม่";document.getElementById("saveButton").textContent="บันทึก";dialog.showModal()}
function editTransaction(index){editingIndex=index;const item=tx[index];document.getElementById("title").value=item.title;document.getElementById("category").value=item.category;document.getElementById("transactionDate").value=item.date;document.getElementById("amount").value=item.amount;document.getElementById("modalTitle").textContent="แก้ไขรายการ";document.getElementById("saveButton").textContent="บันทึกการแก้ไข";dialog.showModal()}
function deleteTransaction(index){const item=tx[index];if(!item||!confirm("ยืนยันการลบรายการ ‘"+item.title+"’ ใช่หรือไม่?"))return;tx.splice(index,1);render()}
function cancelTransaction(){editingIndex=null;dialog.close()}
form.addEventListener("submit",e=>{e.preventDefault();const item={title:document.getElementById("title").value,category:document.getElementById("category").value,date:document.getElementById("transactionDate").value,amount:+document.getElementById("amount").value};if(editingIndex===null)tx.push(item);else tx[editingIndex]=item;editingIndex=null;dialog.close();document.getElementById("dayFilter").value=item.date;render()});document.getElementById("dayFilter").addEventListener("change",render);render();
</script></body></html>
